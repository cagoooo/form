<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>班級榮譽榜名單調查</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      /* 基礎設定 */
      body { 
        font-family: "Noto Sans TC", sans-serif; 
        background-color: transparent; 
        color: #334155;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* 優化捲軸體驗 */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      .input-transition { transition: all 0.2s ease-in-out; }
      
      /* Modal 動畫 */
      .modal-enter { animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
      @keyframes modalFadeIn { 
        from { opacity: 0; transform: scale(0.95) translateY(10px); } 
        to { opacity: 1; transform: scale(1) translateY(0); } 
      }
      
      input[type="text"] { font-size: 16px; }
    </style>
  </head>
  <body class="p-2 sm:p-4 w-full">

    <div class="w-full max-w-3xl mx-auto">
      
      <!-- 主卡片 -->
      <div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
        
        <!-- 標題區塊 -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-5 sm:p-6 text-center relative overflow-hidden">
          <div class="absolute top-0 left-0 w-24 h-24 bg-white opacity-10 rounded-full -translate-x-10 -translate-y-10"></div>
          <div class="absolute bottom-0 right-0 w-32 h-32 bg-white opacity-10 rounded-full translate-x-10 translate-y-10"></div>
          
          <h1 class="text-xl sm:text-2xl font-bold text-white tracking-wide relative z-10 drop-shadow-md">
            班級榮譽榜調查
          </h1>
          <p class="text-blue-100 text-sm mt-1 relative z-10">
            請協助填寫班級獲獎與進步名單
          </p>
        </div>

        <div class="p-4 sm:p-6">
          <form id="awardForm" onsubmit="handleFormSubmit(event)" class="space-y-6">
            
            <!-- 1. 班級欄位 -->
            <div class="relative">
              <label for="className" class="block text-sm font-bold text-slate-700 mb-2 ml-1">
                班級 <span class="text-red-500">*</span>
              </label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                  </svg>
                </div>
                <input type="text" id="className" name="className" required 
                  placeholder="請輸入班級 (例: 301)" 
                  class="input-transition w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm">
              </div>
            </div>

            <!-- 分隔線 -->
            <hr class="border-slate-100">

            <!-- 2. 學期成績優異區塊 -->
            <div id="section-top5" class="bg-blue-50/50 rounded-xl border border-blue-100 p-4 sm:p-5 scroll-mt-4">
              <div class="flex items-center gap-2 mb-4 border-b border-blue-200/60 pb-2">
                <span class="bg-blue-100 text-blue-600 p-1.5 rounded-lg">
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                  </svg>
                </span>
                <div>
                  <h2 class="text-lg font-bold text-blue-800">學期成績優異</h2>
                  <p class="text-xs text-blue-600/80">請填寫前五名同學</p>
                </div>
              </div>
              
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-4">
                <div class="space-y-1"><label class="text-xs font-semibold text-blue-700 ml-1">第 1 名</label><input type="text" name="top_1" class="input-top w-full p-2.5 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-blue-400 outline-none transition shadow-sm bg-white" placeholder="姓名"></div>
                <div class="space-y-1"><label class="text-xs font-semibold text-blue-700 ml-1">第 2 名</label><input type="text" name="top_2" class="input-top w-full p-2.5 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-blue-400 outline-none transition shadow-sm bg-white" placeholder="姓名"></div>
                <div class="space-y-1"><label class="text-xs font-semibold text-blue-700 ml-1">第 3 名</label><input type="text" name="top_3" class="input-top w-full p-2.5 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-blue-400 outline-none transition shadow-sm bg-white" placeholder="姓名"></div>
                <div class="space-y-1"><label class="text-xs font-semibold text-blue-700 ml-1">第 4 名</label><input type="text" name="top_4" class="input-top w-full p-2.5 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-blue-400 outline-none transition shadow-sm bg-white" placeholder="姓名"></div>
                <div class="space-y-1"><label class="text-xs font-semibold text-blue-700 ml-1">第 5 名</label><input type="text" name="top_5" class="input-top w-full p-2.5 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-blue-400 outline-none transition shadow-sm bg-white" placeholder="姓名"></div>
              </div>

              <!-- 備用名單 -->
              <div class="bg-blue-100/50 rounded-lg p-3 border border-blue-100">
                <span class="text-xs font-bold text-blue-600 mb-2 block uppercase flex items-center">
                  <svg class="w-3 h-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                  備用名單
                </span>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <input type="text" name="top_backup_1" placeholder="備用 1" class="w-full p-2 border border-blue-200/60 rounded-md text-sm focus:ring-2 focus:ring-blue-300 outline-none bg-white/80">
                  <input type="text" name="top_backup_2" placeholder="備用 2" class="w-full p-2 border border-blue-200/60 rounded-md text-sm focus:ring-2 focus:ring-blue-300 outline-none bg-white/80">
                  <input type="text" name="top_backup_3" placeholder="備用 3" class="w-full p-2 border border-blue-200/60 rounded-md text-sm focus:ring-2 focus:ring-blue-300 outline-none bg-white/80">
                </div>
              </div>
            </div>

            <!-- 3. 進步獎調查區塊 -->
            <div id="section-imp" class="bg-green-50/50 rounded-xl border border-green-100 p-4 sm:p-5 scroll-mt-4">
              <div class="flex items-center gap-2 mb-4 border-b border-green-200/60 pb-2">
                <span class="bg-green-100 text-green-600 p-1.5 rounded-lg">
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                  </svg>
                </span>
                <div>
                  <h2 class="text-lg font-bold text-green-800">進步獎調查</h2>
                  <p class="text-xs text-green-600/80">請填寫進步同學</p>
                </div>
              </div>
              
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                <div class="space-y-1"><label class="text-xs font-semibold text-green-700 ml-1">進步獎 1</label><input type="text" name="imp_1" class="input-imp w-full p-2.5 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-400 focus:border-green-400 outline-none transition shadow-sm bg-white" placeholder="姓名"></div>
                <div class="space-y-1"><label class="text-xs font-semibold text-green-700 ml-1">進步獎 2</label><input type="text" name="imp_2" class="input-imp w-full p-2.5 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-400 focus:border-green-400 outline-none transition shadow-sm bg-white" placeholder="姓名"></div>
                <div class="space-y-1"><label class="text-xs font-semibold text-green-700 ml-1">進步獎 3</label><input type="text" name="imp_3" class="input-imp w-full p-2.5 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-400 focus:border-green-400 outline-none transition shadow-sm bg-white" placeholder="姓名"></div>
              </div>

              <div class="bg-green-100/50 rounded-lg p-3 border border-green-100">
                <span class="text-xs font-bold text-green-600 mb-2 block uppercase flex items-center">
                  <svg class="w-3 h-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                  備用名單
                </span>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <input type="text" name="imp_backup_1" placeholder="備用 1" class="w-full p-2 border border-green-200/60 rounded-md text-sm focus:ring-2 focus:ring-green-300 outline-none bg-white/80">
                  <input type="text" name="imp_backup_2" placeholder="備用 2" class="w-full p-2 border border-green-200/60 rounded-md text-sm focus:ring-2 focus:ring-green-300 outline-none bg-white/80">
                </div>
              </div>
            </div>

            <!-- 送出按鈕 -->
            <div class="pt-2">
              <button type="submit" id="submitBtn" class="group w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3.5 px-6 rounded-lg hover:from-blue-700 hover:to-indigo-700 active:scale-[0.98] transition-all duration-200 shadow-lg shadow-blue-500/30 flex justify-center items-center gap-2 text-lg">
                <span>確認送出</span>
                <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
              </button>
            </div>
            
          </form>
        </div>
      </div>

      <!-- 自訂彈出視窗 (Modal) -->
      <div id="customModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4 transition-opacity duration-300">
        <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full modal-enter overflow-hidden transform">
          <div id="modalHeader" class="p-5 flex items-center justify-center">
            <div id="modalIcon" class="p-3 rounded-full bg-opacity-20"></div>
          </div>
          <div class="px-6 pb-6 text-center">
            <h3 id="modalTitle" class="text-xl font-bold text-slate-800 mb-2">標題</h3>
            <p id="modalMessage" class="text-slate-600 mb-6 leading-relaxed">內容</p>
            <button id="modalBtn" onclick="closeModal()" class="w-full py-3 px-4 rounded-xl font-bold transition-all duration-200 active:scale-95 text-white shadow-md">關閉</button>
          </div>
        </div>
      </div>

    </div>

    <script>
      // ==========================================
      // 設定 Google Apps Script 部署網址 (已更新為您的新網址)
      // ==========================================
      // 注意：請確認以下網址開頭是 AKfycby8... (這是您截圖中的新版本)
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby8MtkW1n2Ag0Y-J1PcaTwlLO_xUYRTKAxM8dUadY2ZnJxlIkcClvCqw9nU0XPNE6_o/exec"; 

      // 檢查欄位是否有填寫
      function checkSectionFilled(className) {
        const inputs = document.querySelectorAll('.' + className);
        let hasValue = false;
        inputs.forEach(input => { if (input.value.trim() !== "") hasValue = true; });
        return hasValue;
      }

      // 顯示 Modal
      function showModal(title, message, isError = false) {
        const modal = document.getElementById('customModal');
        const headerIcon = document.getElementById('modalIcon');
        const titleEl = document.getElementById('modalTitle');
        const msgEl = document.getElementById('modalMessage');
        const btn = document.getElementById('modalBtn');

        if (isError) {
          headerIcon.className = 'p-3 rounded-full bg-red-100 text-red-600';
          headerIcon.innerHTML = '<svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>';
          btn.className = 'w-full py-3 px-4 rounded-xl font-bold transition-all text-white shadow-md bg-red-600 hover:bg-red-700 shadow-red-500/30';
          titleEl.className = "text-xl font-bold text-red-600 mb-2";
        } else {
          headerIcon.className = 'p-3 rounded-full bg-green-100 text-green-600';
          headerIcon.innerHTML = '<svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
          btn.className = 'w-full py-3 px-4 rounded-xl font-bold transition-all text-white shadow-md bg-green-600 hover:bg-green-700 shadow-green-500/30';
          titleEl.className = "text-xl font-bold text-green-700 mb-2";
        }

        titleEl.textContent = title;
        msgEl.textContent = message;
        modal.classList.remove('hidden');
      }

      function closeModal() {
        document.getElementById('customModal').classList.add('hidden');
      }

      function handleFormSubmit(e) {
        e.preventDefault(); 
        
        // 防呆驗證
        if (!checkSectionFilled('input-top')) {
          showModal('資料不完整', '您尚未填寫「學期成績優異」的任何名單。\n請至少填寫一位。', true);
          const modal = document.getElementById('customModal');
          const btn = document.getElementById('modalBtn');
          btn.onclick = function() {
            modal.classList.add('hidden');
            document.getElementById('section-top5').scrollIntoView({ behavior: 'smooth', block: 'center' });
            btn.onclick = closeModal;
          };
          return;
        }

        if (!checkSectionFilled('input-imp')) {
          showModal('資料不完整', '您尚未填寫「進步獎」的任何名單。\n請至少填寫一位。', true);
          const modal = document.getElementById('customModal');
          const btn = document.getElementById('modalBtn');
          btn.onclick = function() {
            modal.classList.add('hidden');
            document.getElementById('section-imp').scrollIntoView({ behavior: 'smooth', block: 'center' });
            btn.onclick = closeModal;
          };
          return;
        }

        var form = e.target;
        var btn = document.getElementById("submitBtn");
        var originalBtnContent = btn.innerHTML;
        
        btn.disabled = true;
        btn.classList.add("opacity-75", "cursor-wait");
        btn.innerHTML = `
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          處理中...
        `;

        var formData = new FormData(form);
        var data = {};
        formData.forEach((value, key) => data[key] = value);

        fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(data),
          headers: { "Content-Type": "text/plain;charset=utf-8" }
        })
        .then(response => response.json())
        .then(data => {
          if(data.status === "success"){
            showModal("🎉 提交成功", data.message);
            form.reset(); 
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            showModal("❌ 提交失敗", data.message, true);
          }
        })
        .catch(error => {
          console.error('Error:', error);
          showModal("❌ 連線錯誤", "無法連線到伺服器，請檢查網路狀況。", true);
        })
        .finally(() => {
          btn.disabled = false;
          btn.classList.remove("opacity-75", "cursor-wait");
          btn.innerHTML = originalBtnContent;
        });
      }
    </script>
  </body>
</html>
